name: Keep alive

on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (retries cover Render cold start)
        run: |
          for i in $(seq 1 6); do
            curl -fsS --max-time 60 "${{ secrets.APP_URL }}/health/db" && exit 0
            sleep 20
          done
          exit 1